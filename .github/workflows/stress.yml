# Stress: the tests, Hammer's self-checks and the menu bar app itself, built with
# Apple's Address Sanitizer (memory errors) and Thread Sanitizer (data races).
# A finding shows as an annotation on the commit.

name: Stress (sanitizers)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sanitizers:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the tests and the app with the ${{ matrix.sanitizer }} sanitizer
        timeout-minutes: 20
        run: |
          target="$(uname -m)-apple-macosx$(sw_vers -productVersion | cut -d. -f1).0"
          flags="-Onone -g -sanitize=${{ matrix.sanitizer }} -target $target"
          swiftc $flags HammerCore.swift Monitor.swift Player.swift Deliveries.swift Tests/main.swift -o /tmp/tests
          swiftc -parse-as-library $flags Hammer.swift HammerCore.swift Monitor.swift MonitorMac.swift \
            Player.swift PlayerMac.swift EdgeMac.swift Deliveries.swift DeliveryAlerts.swift -o /tmp/Hammer

      - name: Run everything under it
        timeout-minutes: 20
        run: |
          set +e
          export TSAN_OPTIONS="halt_on_error=0 second_deadlock_stack=1"
          export ASAN_OPTIONS="halt_on_error=0 detect_leaks=0"
          export HAMMER_PLAYER_SCRIPT="$PWD/PlayerScript.js"
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          run() { name="$1"; shift; echo "=== $name"; limit "$@" > "/tmp/out-$name.txt" 2>&1; echo "exit $?" >> "/tmp/out-$name.txt"; tail -3 "/tmp/out-$name.txt"; }
          run tests 600 /tmp/tests
          run monitor 120 /tmp/Hammer monitor check
          run dim 60 /tmp/Hammer dim-check
          run player 240 /tmp/Hammer player-check /tmp/player-shots
          run edge 120 /tmp/Hammer edge-check
          # The menu bar app itself for two minutes (it reads monitors, scans for lights,
          # builds its menu, checks for updates), then stopped.
          /tmp/Hammer > /tmp/out-app.txt 2>&1 &
          app=$!; sleep 120; kill $app; wait $app; echo "exit (stopped) $?" >> /tmp/out-app.txt
          pkill -x "Microsoft Edge" || true

          found=0
          for f in /tmp/out-*.txt; do
            name=$(basename "$f" .txt)
            n=$(grep -cE "^(WARNING: ThreadSanitizer|==[0-9]+==ERROR: AddressSanitizer|SUMMARY: (Address|Thread)Sanitizer)" "$f")
            crash=$(grep -cE "^exit (1[2-9][0-9]|2[0-9][0-9])$" "$f")
            echo "$name: $n sanitizer reports, crash: $crash"
            if [ "$n" != 0 ] || [ "$crash" != 0 ]; then
              found=1
              # The first report, as an annotation.
              body="$(grep -m1 -A40 -E "^(WARNING: ThreadSanitizer|==[0-9]+==ERROR: AddressSanitizer)" "$f" | head -45 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=${{ matrix.sanitizer }} sanitizer: $name::$body"
            fi
            echo "::notice title=${{ matrix.sanitizer }}: $name::$(tail -2 "$f" | tr '\n' ' ' | sed -e 's/%/%25/g')"
          done
          exit $found
