# Builds Hammer on a real Apple Silicon Mac (GitHub's macOS runner) for every
# push, so a change that only compiles with Apple's frameworks is checked before
# it reaches your Mac. Your Mac still runs the tests itself before installing.
#
# The runner has no monitor or bulbs: this checks that everything builds, the
# tests pass, the monitor check runs without crashing, and signing works.
# Results also show as annotations on the commit.

name: macOS build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sw_vers
          uname -m
          swiftc --version

      - name: Tests
        run: |
          swiftc -O HammerCore.swift Monitor.swift Deliveries.swift Tests/main.swift \
            -o /tmp/hammer-tests 2>&1 | tee /tmp/tests-build.log
          /tmp/hammer-tests | tee /tmp/tests.log
          echo "::notice title=Tests::$(tail -1 /tmp/tests.log)"

      - name: Build the app
        run: |
          swiftc -parse-as-library -O Hammer.swift HammerCore.swift Monitor.swift MonitorMac.swift \
            Deliveries.swift DeliveryAlerts.swift -o /tmp/Hammer 2>&1 | tee /tmp/app-build.log

      - name: Monitor commands (there's no monitor here)
        run: |
          set +e
          /tmp/Hammer monitor check > /tmp/check.txt 2>&1; echo "exit $?" >> /tmp/check.txt
          /tmp/Hammer get brightness >> /tmp/check.txt 2>&1; echo "exit $?" >> /tmp/check.txt
          /tmp/Hammer set brightness 40 >> /tmp/check.txt 2>&1; echo "exit $?" >> /tmp/check.txt
          cat /tmp/check.txt
          # Exit 1 means "no working monitor" (expected here); a crash gives 134 or 139.
          if grep -qE "^exit (13[0-9]|1[4-9][0-9]|2[0-9][0-9])$" /tmp/check.txt; then exit 1; fi

      - name: Full install with signing, twice
        run: |
          bash build.sh 2>&1 | tee /tmp/install1.log
          codesign -d -r- ~/Applications/Hammer.app 2>&1 | grep designated > /tmp/req1.txt
          bash build.sh 2>&1 | tee /tmp/install2.log
          codesign -d -r- ~/Applications/Hammer.app 2>&1 | grep designated > /tmp/req2.txt
          cat /tmp/req1.txt /tmp/req2.txt
          grep -q "Signed with Hammer Local Signing" /tmp/install1.log
          grep -q "Signed with Hammer Local Signing" /tmp/install2.log
          cmp /tmp/req1.txt /tmp/req2.txt
          pkill -x Hammer || true

      - name: Report
        if: always()
        run: |
          # Compiler errors and the monitor check, as annotations (readable without the logs).
          for log in /tmp/tests-build.log /tmp/app-build.log; do
            [ -f "$log" ] || continue
            grep -E "error:" "$log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          done
          for file in /tmp/check.txt /tmp/req1.txt /tmp/install1.log; do
            [ -f "$file" ] || continue
            body="$(tail -60 "$file" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::notice title=$(basename "$file")::$body"
          done
